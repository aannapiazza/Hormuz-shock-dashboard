# Streamlit theme for the Hormuz Shock dashboard.
# Save this file as .streamlit/config.toml in the repo's main folder (next to app.py).
# It makes the whole app dark, so the charts' light text is readable on every computer.

[theme]
base = "dark"
primaryColor = "#ff5a4e"
backgroundColor = "#0b1320"
secondaryBackgroundColor = "#121c2d"
textColor = "#e8edf5"
font = "sans serif"
